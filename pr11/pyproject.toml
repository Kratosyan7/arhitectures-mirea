[project]
name = "parallel-integration"
version = "1.0.0"
description = "Организация параллельных вычислений"
authors = [
    {name = "Мирзоян А.О.", email = "student@edu.mirea.ru"}
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["parallel computing", "numerical integration", "OpenMP", "MPI", "HPC"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Education",
]

dependencies = [
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "mpi4py>=3.1.0; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
windows = [
    # MPI для Windows нужно установить отдельно
]

[project.scripts]
parallel-integration = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
